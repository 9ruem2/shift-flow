name: CI - Test & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Logic & Integrity Tests
        run: |
          PYTHONPATH=backend python -c "
          from app.services.week_calculator import WeekCalculator
          from app.services.excel_shifter import ExcelShifter
          from app.services.validator import ScheduleValidator
          
          # Test week calculations
          weeks = WeekCalculator.get_weeks_for_month(2026, 10)
          assert len(weeks) >= 4, 'Week calculation failed'
          print(f'✅ Week calculator verified: {len(weeks)} weeks found')
          "

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build
